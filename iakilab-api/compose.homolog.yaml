services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iakilab
      POSTGRES_PASSWORD: ${IAKILAB_DATABASE_PASSWORD:?Set a unique local database password}
      POSTGRES_DB: iakilab_homolog
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - iakilab_homolog_data:/var/lib/postgresql/data
volumes:
  iakilab_homolog_data:
